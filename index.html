<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Contactos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="boot-loader" class="boot-loader" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Cargando contactos...</p>
    </div>

    <div id="action-loader" class="action-loader hidden" aria-live="polite">
      <div class="spinner mini" aria-hidden="true"></div>
      <span>Procesando...</span>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <main id="app" class="app hidden" aria-hidden="true">
      <header class="hero" aria-label="Encabezado de la aplicacion">
        <div class="logo-grid" aria-hidden="true">
          <div class="logo-box">📞</div>
          <div class="logo-box">@</div>
          <div class="logo-box">✉️</div>
        </div>
        <h1>Lista de Contactos</h1>
        <p class="hero-note">Tus contactos se guardan en el servidor local de la API.</p>
      </header>

      <section class="panel form-panel" aria-labelledby="form-title">
        <h2 id="form-title" class="sr-only">Formulario de contacto</h2>
        <span id="form-mode" class="sr-only">Modo crear</span>

        <form id="contact-form" novalidate>
          <input type="hidden" id="contact-id" name="contact-id" />

          <div class="grid two">
            <div class="field-group">
              <label class="sr-only" for="first-name">Nombre</label>
              <input id="first-name" name="first-name" type="text" maxlength="40" placeholder="Ingresa tu nombre" />
              <small class="error" id="first-name-error"></small>
            </div>

            <div class="field-group">
              <label class="sr-only" for="last-name">Apellido</label>
              <input id="last-name" name="last-name" type="text" maxlength="40" placeholder="Ingresa tu apellido" />
              <small class="error" id="last-name-error"></small>
            </div>
          </div>

          <div class="grid two">
            <div class="field-group">
              <label class="sr-only" for="phone">Telefono</label>
              <input id="phone" name="phone" type="tel" maxlength="20" placeholder="Ingresa tu telefono" />
              <small class="error" id="phone-error"></small>
            </div>

            <div class="field-group">
              <label class="sr-only" for="city">Ciudad</label>
              <input id="city" name="city" type="text" maxlength="60" placeholder="Ingresa tu ciudad" />
              <small class="error" id="city-error"></small>
            </div>
          </div>

          <div class="field-group">
            <label class="sr-only" for="address">Direccion</label>
            <input id="address" name="address" type="text" maxlength="120" placeholder="Ingresa tu direccion" />
            <small class="error" id="address-error"></small>
          </div>

          <fieldset class="field-group">
            <legend class="sr-only">Genero</legend>
            <div class="radio-row">
              <label class="radio-item" for="gender-female">
                <input id="gender-female" type="radio" name="gender" value="femenino" />
                <span>Femenino</span>
              </label>
              <label class="radio-item" for="gender-male">
                <input id="gender-male" type="radio" name="gender" value="masculino" />
                <span>Masculino</span>
              </label>
            </div>
            <small class="error" id="gender-error"></small>
          </fieldset>

          <div class="actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">AGREGAR</button>
            <button type="button" id="cancel-edit" class="btn btn-ghost hidden">Cancelar edicion</button>
            <button type="button" id="clear-all" class="btn btn-danger-soft hidden">Eliminar todos</button>
          </div>
        </form>
      </section>

      <section class="panel list-panel" aria-labelledby="list-title">
        <h2 id="list-title" class="sr-only">Lista de contactos</h2>
        <p id="counter" class="sr-only">0 contactos</p>

        <div id="empty-state" class="empty-state">
          <p>No hay contactos aun. Agrega el primero para comenzar.</p>
        </div>

        <div id="contact-list" class="contact-list" aria-live="polite"></div>
      </section>
    </main>

    <script src="main-api.js"></script>
  </body>
</html>
